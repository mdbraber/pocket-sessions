# Deployed next to a `src/` checkout of this repo (see `make deploy`): the compose
# file sits one level up, `./data` beside it holds the SQLite database. Assumes a
# host running caddy-docker-proxy with an external `caddy` network.
#
# Host-side `.env` (next to this file, not in git):
#   PCS_DOMAIN=sessions.example.com
#   PCS_AUTH_TOKEN=<openssl rand -hex 24>       # operator credential (curl/scripts)
#   PCS_ALLOWED_EMAILS=you@example.com          # PC accounts allowed to enroll (optional)
#   PCS_APNS_KEY_ID=ABC123DEFG                  # with the .p8 dropped in ./data (optional)
#   PCS_APNS_TEAM_ID=ABCDE12345                 # Apple developer team id (with a key)
#   PCS_APNS_TOPIC=com.example.podcasts         # the app's bundle id (with a key)
#   TS_VERSION=v1.102.4                         # tailscale/tailscale image tag (match the host)
#   TS_AUTHKEY=<one-time Headscale key>         # first start only; remove once ./tailscale has state
services:
  pocket-sessions:
    container_name: pocket-sessions
    build: ./src
    restart: always
    environment:
      - PCS_LISTEN=:8080
      - PCS_DB=/data/pcsessions.db
      - PCS_AUTH_TOKEN=${PCS_AUTH_TOKEN}
      - PCS_ALLOWED_EMAILS=${PCS_ALLOWED_EMAILS:-}
      # APNs: put AuthKey_<KEYID>.p8 in ./data and set PCS_APNS_KEY_ID in .env;
      # PCS_APNS_TEAM_ID and PCS_APNS_TOPIC come from .env as well.
      # Environment-restricted keys: PCS_APNS_KEY_ID = production (or both),
      # PCS_APNS_KEY_ID_SANDBOX = sandbox-only key (dev-signed builds).
      - PCS_APNS_KEY=${PCS_APNS_KEY_ID:+/data/AuthKey_${PCS_APNS_KEY_ID}.p8}
      - PCS_APNS_KEY_ID=${PCS_APNS_KEY_ID:-}
      - PCS_APNS_KEY_SANDBOX=${PCS_APNS_KEY_ID_SANDBOX:+/data/AuthKey_${PCS_APNS_KEY_ID_SANDBOX}.p8}
      - PCS_APNS_KEY_ID_SANDBOX=${PCS_APNS_KEY_ID_SANDBOX:-}
      - PCS_APNS_TEAM_ID=${PCS_APNS_TEAM_ID:-}
      - PCS_APNS_TOPIC=${PCS_APNS_TOPIC:-}
      # Episode watcher cadence and visible-alert policy (synced|all|off).
      - PCS_EPISODE_POLL=${PCS_EPISODE_POLL:-10m}
      - PCS_NOTIFY=${PCS_NOTIFY:-synced}
      # Playback-progress watcher + local hook scripts (see hooks/README.md).
      - PCS_PROGRESS_POLL=${PCS_PROGRESS_POLL:-15m}
      - PCS_PROGRESS_MIN_DELTA=${PCS_PROGRESS_MIN_DELTA:-30}
      - PCS_HOOKS_DIR=${PCS_HOOKS_DIR:-/data/hooks}
      - PCS_HOOK_TIMEOUT=${PCS_HOOK_TIMEOUT:-30s}
      # Webhook sinks: event JSON POSTed to each URL (e.g. n8n flows).
      - PCS_WEBHOOK_URLS=${PCS_WEBHOOK_URLS:-}
      - PCS_WEBHOOK_TOKEN=${PCS_WEBHOOK_TOKEN:-}
      # Consumed by hooks/owntube.sh, not by the server itself.
      - OWNTUBE_URL=${OWNTUBE_URL:-}
      - OWNTUBE_MEDIA_HOST=${OWNTUBE_MEDIA_HOST:-}
      - PCS_FEED_MATCH=${PCS_FEED_MATCH:-}
      - OWNTUBE_TOKEN=${OWNTUBE_TOKEN:-}
    volumes:
      - ./data:/data
    # Home access (OwnTube) via the ts-pocket-sessions sidecar: its Tailscale
    # identity carries tag:svc-owntube-client; the grant lives in the Headscale
    # policy. Caddy reaches :8080 through the sidecar on the caddy network.
    network_mode: service:ts-pocket-sessions
    depends_on:
      ts-pocket-sessions:
        condition: service_healthy
        restart: true
    cap_drop:
      - NET_RAW

  ts-pocket-sessions:
    container_name: ts-pocket-sessions
    image: tailscale/tailscale:${TS_VERSION:?set TS_VERSION in .env}
    restart: always
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_HOSTNAME=svc-pocket-sessions
      - TS_ACCEPT_DNS=false
      # The tag comes from the registration key; Headscale rejects --advertise-tags with a tagged key.
      - TS_EXTRA_ARGS=--login-server=https://hs.nedworks.org --accept-routes
      - TS_TAILSCALED_EXTRA_ARGS=--no-logs-no-support
      - TS_NO_LOGS_NO_SUPPORT=true
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9002
    volumes:
      - ./tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    # Home names resolve at OPNsense (allowed by the policy); Docker's embedded
    # DNS still answers container names on caddy first.
    dns:
      - 172.30.10.1
    networks:
      caddy:
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9002/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      caddy: ${PCS_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      # Compress toward clients when the upstream didn't (PC compresses
      # selectively; relayed responses that arrive plain would otherwise ship
      # uncompressed to the phone). Caddy skips bodies that already carry a
      # Content-Encoding, so gzip passthrough is untouched.
      caddy.encode: zstd gzip

networks:
  caddy:
    external: true
